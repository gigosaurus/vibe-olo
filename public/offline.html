<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12102a" />
    <title>Party Deck is offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #12102a;
        color: #f4f1ff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        color: #c8c2e8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection yet</h1>
      <p>
        Party Deck works offline once it has loaded successfully at least once. Reconnect briefly,
        open the app, and it will keep working without a network afterwards.
      </p>
    </main>
  </body>
</html>
