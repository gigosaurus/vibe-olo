name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

# Only the default branch is published. Any other branch still gets nothing
# deployed, and `workflow_dispatch` allows a manual run from any branch.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer commit supersedes an in-flight deploy, but never cancels one that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Quality gates run before the build so a broken commit is never
      # published. `npm run build` type-checks as part of itself.
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # `enablement: true` turns Pages on (with GitHub Actions as the source)
      # the first time this runs, so the repository needs no manual setup.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
